<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Virtuel - Salle de Garde</title>
<style>
body{font-family:system-ui;max-width:800px;margin:0 auto;padding:16px;background:#f6f8fa}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
#chat{height:420px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:14px 0;background:#fff}
.msg{margin:10px 0;padding:10px 14px;border-radius:16px;max-width:85%;line-height:1.5;white-space:pre-wrap}
.user{background:#dcf8c6;margin-left:auto}
.parent{background:#eef2f7}
.badge{font-size:11px;color:#888;margin-top:2px}
input,button{padding:12px;border-radius:10px;border:1px solid #d1d5db}
button{background:#0b63f6;color:white;border:none;font-weight:600;cursor:pointer}
small{color:#6b7280}
</style>
</head>
<body>
<div class="card">
<h2>🩺 Patient Virtuel - Salle de Garde</h2>
<p style="font-size:14px;color:#4b5563">Maman de 2 ans, fièvre + pleurs à la miction. Pose tes questions comme en garde.</p>
<div id="chat"></div>
<div style="display:flex;gap:8px">
<input id="q" style="flex:1" placeholder="Ex: Depuis quand il pleure quand il urine ?" />
<button id="send">Envoyer</button>
</div>
<small>Simulation pédagogique. IA via Cloudflare 3-en-1 (Groq → Gemini → HF). 0 téléchargement.</small>
<div id="stats" style="font-size:11px;color:#9ca3af;margin-top:8px">Worker: muddy-shadow-c8d5</div>
</div>
<script>
const WORKER_URL = "https://muddy-shadow-c8d5.voldikiala29.workers.dev";
const chatDiv = document.getElementById('chat');
const input = document.getElementById('q');
const btn = document.getElementById('send');
function addMsg(t, cls, src){
  const d=document.createElement('div'); d.className='msg '+cls; d.textContent=t;
  chatDiv.appendChild(d);
  if(src){
    const b=document.createElement('div'); b.className='badge'; b.textContent='via '+src;
    chatDiv.appendChild(b);
  }
  chatDiv.scrollTop=chatDiv.scrollHeight;
}
addMsg("Bonjour docteur, mon bébé a de la fièvre depuis 2 jours, je suis inquiète...", "parent");
async function envoyer(){
  const txt = input.value.trim(); if(!txt) return;
  addMsg(txt, "user"); input.value=""; btn.disabled=true; btn.textContent="...";
  const typing = document.createElement('div'); typing.className='msg parent'; typing.textContent='...'; chatDiv.appendChild(typing);
  try{
    const res = await fetch(WORKER_URL, {method:"POST",headers:{"Content-Type":"application/json"},body: JSON.stringify({question: txt})});
    const data = await res.json();
    if(typing.parentNode) chatDiv.removeChild(typing);
    addMsg(data.reponse || data.error || "Erreur", "parent", data.source);
  }catch(e){
    if(typing.parentNode) chatDiv.removeChild(typing);
    addMsg("Erreur réseau, vérifie Cloudflare.", "parent");
  }
  btn.disabled=false; btn.textContent="Envoyer";
}
btn.onclick=envoyer;
input.addEventListener('keydown', e=>{ if(e.key==='Enter') envoyer(); });
</script>
</body>
</html>
