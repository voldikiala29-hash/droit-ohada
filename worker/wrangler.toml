# Configuration du Worker du patient virtuel.
# Ce fichier décrit la cible. Il ne déploie rien par lui-même.
# ATTENTION : "wrangler deploy" remplace les réglages faits dans le tableau de bord Cloudflare.
# Remplacer l'identifiant KV par la valeur réelle avant tout déploiement (voir worker/README.md).

name = "muddy-shadow-c8d5"
main = "patient-worker.js"
compatibility_date = "2024-09-23"

[ai]
binding = "AI"

# Plans Premium (lecture seule pour le Worker)
[[kv_namespaces]]
binding = "STATE"
id = "REMPLACER_PAR_ID_KV_STATE"

# Quotas, plafond de messages et limites de débit (atomiques)
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaLimiter"]

[vars]
# Politique des quotas (4 novembre 2026, voir docs/quotas-politique.md) :
# gratuit 5 cas par mois, Premium 150 cas par mois (constantes dans patient-worker.js),
# 40 messages par utilisateur et par cas et par mois (MAX_MESSAGES_PER_CASE ci-dessous).
ALLOWED_ORIGIN = "https://salledegarde.online"
FIREBASE_PROJECT_ID = "salledegarde-89dae"
MAX_MESSAGES_PER_CASE = "40"
USER_REQUESTS_PER_MINUTE = "20"
IP_REQUESTS_PER_MINUTE = "20"
# Date limite de la période de transition (1.4-C) : après cette date, un navigateur sans en-tête X-SDG-Protocol
# reçoit 426. Tant que la valeur n'est pas une date ISO valide, le Worker répond 503 à toute demande (échec fermé).
# À fixer AU déploiement, à la date de déploiement + 30 jours. Ne pas laisser le placeholder en production.
PROTOCOL_CUTOFF = "REMPLACER_PAR_DATE_DE_DEPLOIEMENT_PLUS_30_JOURS"
